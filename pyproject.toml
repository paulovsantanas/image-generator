[project]
name = "image-generator"
version = "0.2.0"
description = "Library for AI image generation with OpenAI, Google, and HuggingFace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"google-genai>=1.10.0",
	"openai>=1.40.0",
	"diffusers>=0.32.0",
	"torch>=2.4.0",
	"transformers>=4.46.0",
	"accelerate>=1.0.0",
	"bitsandbytes>=0.49.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
