[project]
name = "image-generator"
version = "0.1.0"
description = "Library for AI image generation with Gemini and OpenAI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"google-genai>=1.10.0",
	"openai>=1.40.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["image_generator"]
